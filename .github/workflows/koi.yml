name: Generate koi contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"     # every 12 hours
  workflow_dispatch:            # lets you run it by hand
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build koi SVG from real contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_FILE: dist/koi-contribution.svg
        run: python3 scripts/generate_koi.py

      - name: Push SVG to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
